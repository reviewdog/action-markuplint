name: Update Semver
on:
  push:
    branches-ignore:
      - "**"
    tags:
      - "v*.*.*"
jobs:
  update-semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: haya14busa/action-update-semver@v1.2.1
        with:
          github_token: ${{ secrets.github_token }}
